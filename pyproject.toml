[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhimo"
version = "0.2.0"
description = "Chinese calligraphy recognition and analysis application"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0,<2",
    "numpy>=1.24",
    "Pillow>=9",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
